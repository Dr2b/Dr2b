<text x="56" y="318" class="mono" font-size="10.5" letter-spacing="2" fill="#C5D0E0">INNATE</text>
<text x="56" y="335" class="serif" font-size="12.5" font-style="italic" fill="#6F7E96">respond fast</text>
<text x="196" y="298" class="sans" font-size="15.5" fill="#E6ECF5">Innate immunity</text>
<text x="196" y="320" class="mono" font-size="12" fill="#8B9BB4">inflammation, first responders</text>
<text x="436" y="298" class="sans" font-size="15.5" fill="#E6ECF5">Gateway &amp; identity</text>
<text x="436" y="320" class="mono" font-size="12" fill="#8B9BB4">authN/Z · rate limits</text>
<text x="676" y="298" class="sans" font-size="15.5" fill="#E6ECF5">Detection</text>
<text x="676" y="320" class="mono" font-size="12" fill="#8B9BB4">telemetry · alerting · triage</text>
<text x="56" y="396" class="serif" font-size="26" fill="#E6ECF5" opacity="0.9">L3</text>
<text x="56" y="418" class="mono" font-size="10.5" letter-spacing="2" fill="#C5D0E0">ADAPTIVE</text>
<text x="56" y="435" class="serif" font-size="12.5" font-style="italic" fill="#6F7E96">respond precisely</text>
<text x="196" y="398" class="sans" font-size="15.5" fill="#E6ECF5">Adaptive immunity</text>
<text x="196" y="420" class="mono" font-size="12" fill="#8B9BB4">antibodies for one target</text>
<text x="436" y="398" class="sans" font-size="15.5" fill="#E6ECF5">Services &amp; data</text>
<text x="436" y="420" class="mono" font-size="12" fill="#8B9BB4">least privilege · isolation</text>
<text x="676" y="398" class="sans" font-size="15.5" fill="#E6ECF5">Incident response</text>
<text x="676" y="420" class="mono" font-size="12" fill="#8B9BB4">contain · eradicate · recover</text>
