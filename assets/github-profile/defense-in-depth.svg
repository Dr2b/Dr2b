<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d">
<title id="t">Fig. 02 — Defense in depth, read three ways</title>
<desc id="d">Four layers of defence compared across the body, a software system and a blue-team defender: L1 barrier, L2 innate response, L3 adaptive response, L4 memory. In the probe lane, legitimate traffic passes all layers; an antigen breaches the barrier, is detected at L2, answered at L3 and remembered at L4.</desc>
<!-- Generated layout: bands every 100 units from y=150; columns at x=196 / 436 / 676; probe lane at x=930. -->
<defs>
  <radialGradient id="bg" cx="0.5" cy="0.35" r="0.8">
    <stop offset="0" stop-color="#0E1A30"/><stop offset="0.6" stop-color="#091120"/><stop offset="1" stop-color="#060A13"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="#1C2942"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="plate"><rect width="1000" height="600" rx="22"/></clipPath>
</defs>
<style>
  .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
  .sans  { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .mono  { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }

  /* legitimate traffic falls through every layer */
  .pk { opacity: 0; animation: pk 6s linear infinite; }
  @keyframes pk { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateY(410px); opacity: 0; } }

  /* the antigen story, 12 s: breach L1 → detected L2 → answered L3 → remembered L4 */
  .ag { fill: #FF8E6E; stroke: #FF8E6E; animation: ag 12s ease-in-out infinite; }
  @keyframes ag {
    0%   { transform: translateY(-160px); opacity: 0; fill: #FF8E6E; stroke: #FF8E6E; }
    4%   { opacity: 1; }
    22%  { transform: translateY(0); fill: #FF8E6E; stroke: #FF8E6E; }
    32%  { fill: #6F7E96; stroke: #6F7E96; opacity: 1; }
    48%  { opacity: 0; }
    100% { transform: translateY(0); opacity: 0; fill: #6F7E96; stroke: #6F7E96; }
  }
  .lock { transform-box: fill-box; transform-origin: center; animation: lock 12s ease-out infinite; }
  @keyframes lock { 0%, 21% { transform: scale(2.4); opacity: 0; } 27% { transform: scale(1); opacity: 1; } 44% { opacity: 1; } 52%, 100% { transform: scale(1); opacity: 0; } }
  .b2 { animation: b2 12s ease-in-out infinite; }
  .b3 { animation: b3 12s ease-in-out infinite; }
  .b4 { animation: b4 12s ease-in-out infinite; }
  @keyframes b2 { 0%, 22% { opacity: 0; } 27%, 58% { opacity: 1; } 68%, 100% { opacity: 0; } }
  @keyframes b3 { 0%, 32% { opacity: 0; } 37%, 66% { opacity: 1; } 76%, 100% { opacity: 0; } }
  @keyframes b4 { 0%, 46% { opacity: 0; } 52%, 90% { opacity: 1; } 98%, 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { .pk, .ag, .lock, .b2, .b3, .b4 { animation: none !important; } }
</style>
<g clip-path="url(#plate)"><rect width="1000" height="600" fill="url(#bg)"/><rect width="1000" height="600" fill="url(#dots)" opacity="0.7"/></g>
